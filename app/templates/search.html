{% extends "base.html" %}
{% block title %}Search · Vinyl{% endblock %}
{% block content %}

<form
  hx-post="/search/results"
  hx-target="#search-results"
  hx-indicator="#search-indicator"
  class="mb-6"
>
  <div class="flex gap-2">
    <select name="field"
            class="bg-paper border border-line rounded-md px-2 py-2 text-sm text-ink focus:outline-none focus:border-ink">
      {% for key, _ in fields.items() %}
        <option value="{{ key }}">{{ key }}</option>
      {% endfor %}
    </select>
    <input type="text" name="q" required autofocus
           placeholder="search discogs…"
           class="flex-1 bg-paper border border-line rounded-md px-3 py-2 text-ink
                  placeholder:text-muted focus:outline-none focus:border-ink">
    <button type="submit"
            class="bg-ink text-paper rounded-md px-4 py-2 text-sm font-medium hover:bg-accent transition">
      go
    </button>
  </div>
  <div id="search-indicator" class="htmx-indicator text-muted text-sm mt-2">searching…</div>
</form>

<div id="search-results">
  <p class="text-muted text-sm">type something and hit go.</p>
</div>

{% endblock %}
